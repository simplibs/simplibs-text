[build-system]
requires = ["setuptools>=77.0.3"]                 # 77+ is needed for `license = "MIT"` (SPDX string)
build-backend = "setuptools.build_meta"

[project]
name = "simplibs-text"
version = "0.1.0"
description = "Small, safe steps that turn one text into another: remove, keep, replace and decorate parts of it, clean its characters and convert between naming styles — as plain functions and as pipeline actions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"                        # the README badge and "Requires Python" must say the same
keywords = [
    "text",
    "string",
    "text-processing",
    "string-manipulation",
    "regex",
    "replace",
    "whitespace",
    "unicode",
    "case-conversion",
    "snake-case",
    "camel-case",
    "pipeline",
    "simplibs",
    "simplibs-text",
    "developer-tools",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
]
dependencies = [
    "simplibs-exception>=1.1.4",                  # structured cards (ParamError) for every wrong call
    "simplibs-validate>=0.3.2",                   # @validate_call on the public functions
    "simplibs-actions>=0.2.2",                    # create_action behind simplibs.text.actions
    "simplibs-types>=0.2.0",                      # int_positive and int_non_negative for widths and counts
    "simplibs-regex>=0.4.0",                      # the Regex tree accepted as a Pattern
]

[[project.authors]]
name = "Dalibor Sova (Sudip2708)"
email = "daliborsova@seznam.cz"

[project.urls]
Homepage = "https://github.com/simplibs/simplibs-text"
Repository = "https://github.com/simplibs/simplibs-text"
Issues = "https://github.com/simplibs/simplibs-text/issues"
Changelog = "https://github.com/simplibs/simplibs-text/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=9.0",          # the `subtests` fixture is built in since pytest 9.0
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v -rs"                                # -rs lists every skipped test with its reason

[tool.coverage.run]
branch = true
source = ["simplibs.text"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"simplibs.text" = ["py.typed"]               # without this section py.typed is NOT in the wheel
